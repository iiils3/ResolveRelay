name: Clean one-time QA workflows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-cleanup-one-time.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-time QA artifacts
        run: |
          find .github/workflows -maxdepth 1 -type f ! -name 'build.yml' ! -name 'publish-static.yml' -delete
          rm -f public/rr-deploy-marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows public || true
          git diff --cached --quiet && exit 0
          git commit -m 'Remove one-time QA workflows and deploy markers'
          git push origin main
