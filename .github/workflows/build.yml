name: Build ResolveRelay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Validate Netlify backup function
        run: npx esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --outfile=/tmp/resolverelay-netlify-api.mjs
      - name: Validate Cloudflare Pages function
        run: npx esbuild 'functions/api/[[path]].ts' --bundle --platform=browser --format=esm --outfile=/tmp/resolverelay-cloudflare-api.mjs
