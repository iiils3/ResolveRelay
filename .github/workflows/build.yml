name: Build ResolveRelay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Validate WebMCP registration exists
        run: grep -q 'modelContext' src/App.tsx && grep -q 'registerTool' src/App.tsx
      - name: Validate authenticated AI relay source exists
        run: test -f supabase/functions/ai-relay/index.ts && grep -q 'claim-assist' supabase/functions/ai-relay/index.ts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
