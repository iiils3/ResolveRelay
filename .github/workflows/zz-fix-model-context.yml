name: Fix WebMCP context helper
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-fix-model-context.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair model context helper
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          bad="const getModelContext=()=> getModelContext() || (navigator as any).modelContext || null;"
          good="const getModelContext=()=> (document as any).modelContext || (navigator as any).modelContext || null;"
          assert bad in s, 'recursive helper not found'
          p.write_text(s.replace(bad,good,1))
          Path('.github/workflows/zz-fix-model-context.yml').unlink()
      - name: Validate build and helper
        run: |
          npm ci --no-audit --no-fund
          npm run build
          grep -Fq "const getModelContext=()=> (document as any).modelContext || (navigator as any).modelContext || null;" src/App.tsx
          ! grep -Fq "const getModelContext=()=> getModelContext()" src/App.tsx
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix WebMCP model context detection'
          git push origin main
