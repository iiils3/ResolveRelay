name: Fix consumer offer loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-consumer-offer-loading.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make related claim reads explicit
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="async function loadCase(id:string){const {data,error}=await supabase.from('cases').select('*,resolution_offers(*),merchant_responses(*),case_events(*)').eq('id',id).single();if(error)throw error;const [{data:transactions,error:txError},{data:evidence,error:evError},{data:contacts,error:contactError}]=await Promise.all([supabase.from('transactions').select('*').eq('case_id',id).order('created_at',{ascending:true}),supabase.from('evidence').select('id,file_name').eq('case_id',id),supabase.from('contact_attempts').select('*').eq('case_id',id).order('contacted_at',{ascending:false})]);if(txError)throw txError;if(evError)throw evError;if(contactError)throw contactError;return {...data,transactions:transactions||[],evidence:evidence||[],contact_attempts:contacts||[]} as CaseRow}"
          new="async function loadCase(id:string){const {data,error}=await supabase.from('cases').select('*').eq('id',id).single();if(error)throw error;const [{data:transactions,error:txError},{data:evidence,error:evError},{data:contacts,error:contactError},{data:offers,error:offerError},{data:responses,error:responseError},{data:events,error:eventError}]=await Promise.all([supabase.from('transactions').select('*').eq('case_id',id).order('created_at',{ascending:true}),supabase.from('evidence').select('id,file_name').eq('case_id',id),supabase.from('contact_attempts').select('*').eq('case_id',id).order('contacted_at',{ascending:false}),supabase.from('resolution_offers').select('*').eq('case_id',id).order('created_at',{ascending:true}),supabase.from('merchant_responses').select('*').eq('case_id',id).order('created_at',{ascending:true}),supabase.from('case_events').select('*').eq('case_id',id).order('created_at',{ascending:true})]);if(txError)throw txError;if(evError)throw evError;if(contactError)throw contactError;if(offerError)throw offerError;if(responseError)throw responseError;if(eventError)throw eventError;return {...data,transactions:transactions||[],evidence:evidence||[],contact_attempts:contacts||[],resolution_offers:offers||[],merchant_responses:responses||[],case_events:events||[]} as CaseRow}"
          assert old in s, 'loadCase block not found'
          p.write_text(s.replace(old,new,1))
      - name: Verify build
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Load consumer resolution offers explicitly'
          git push origin main
