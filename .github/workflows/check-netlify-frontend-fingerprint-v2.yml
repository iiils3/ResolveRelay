name: Check Netlify frontend fingerprint v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-netlify-frontend-fingerprint-v2.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live frontend bundle
        shell: python
        run: |
          import re, urllib.request
          base='https://resolverelai.netlify.app'
          html=urllib.request.urlopen(base+'/',timeout=20).read().decode('utf-8','replace')
          m=re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']',html)
          if not m:
              raise SystemExit('No frontend JS asset found')
          asset=m.group(1)
          if asset.startswith('/'):
              url=base+asset
          elif asset.startswith('http'):
              url=asset
          else:
              url=base+'/'+asset
          js=urllib.request.urlopen(url,timeout=30).read().decode('utf-8','replace')
          print('LIVE_ASSET='+asset)
          markers={
              'demo_access':'Demo access' in js,
              'role_choice':'roleChoice' in js,
              'consumer_chat_key':'rr-chat-' in js,
              'explicit_offer_query':'resolution_offers' in js and 'merchant_responses' in js,
          }
          print('MARKERS='+repr(markers))
          if not markers['demo_access'] or not markers['role_choice']:
              print('NETLIFY_FRONTEND_CURRENT=false')
              raise SystemExit(2)
          print('NETLIFY_FRONTEND_CURRENT=true')
