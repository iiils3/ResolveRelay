name: Apply challenge collaboration polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-challenge-polish-one-time.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused product improvements
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          if 'const getModelContext=' not in s:
            s=s.replace("type Lang='ar'|'en';", "const getModelContext=()=> (document as any).modelContext || (navigator as any).modelContext || null;\ntype Lang='ar'|'en';", 1)

          helpers=r'''function getWorkflowCheckpoint(c:CaseRow){
            const events=[...(c.case_events||[])].map(x=>new Date(x.created_at).getTime()).filter(Number.isFinite);
            const contacts=[...(c.contact_attempts||[])].map(x=>new Date(x.contacted_at).getTime()).filter(Number.isFinite);
            const base=new Date(c.created_at).getTime();
            const latest=Math.max(base,...events,...contacts);
            const elapsedHours=Math.max(0,Math.floor((Date.now()-latest)/3600000));
            const waitingForMerchant=['submitted','merchant_viewed','consumer_replied'].includes(c.status);
            const waitingForConsumer=['evidence_requested','resolution_offered'].includes(c.status);
            const terminal=['resolved','rejected','closed'].includes(c.status);
            return {latestActivity:new Date(latest).toISOString(),elapsedHours,checkpointHours:waitingForMerchant?72:null,checkpointReached:waitingForMerchant&&elapsedHours>=72,waitingFor:waitingForMerchant?'merchant':waitingForConsumer?'consumer':terminal?'complete':'workflow'};
          }
          function getRoleActions(role:'consumer'|'merchant',status:string){
            const actions:string[]=[];
            if(role==='consumer'){
              actions.push('log_contact_attempt');
              if(['ready','submitted'].includes(status))actions.push('create_merchant_invitation');
              if(status==='ready')actions.push('submit_case_to_merchant');
              if(status==='resolution_offered')actions.push('accept_resolution','decline_resolution');
            }
            if(role==='merchant'&&['submitted','merchant_viewed','consumer_replied'].includes(status))actions.push('merchant_request_evidence','merchant_offer_resolution','merchant_reject_case');
            return actions;
          }
          function AgentWorkspace({lang,c,role}:{lang:Lang;c:CaseRow;role:'consumer'|'merchant'}){
            const connected=Boolean(getModelContext());
            const actions=getRoleActions(role,c.status);
            const actionLabel=(x:string)=>({log_contact_attempt:lang==='ar'?'تسجيل محاولة تواصل':'Log contact attempt',create_merchant_invitation:lang==='ar'?'إنشاء دعوة تاجر':'Create merchant invitation',submit_case_to_merchant:lang==='ar'?'إرسال المطالبة':'Submit claim',accept_resolution:lang==='ar'?'قبول الحل':'Accept resolution',decline_resolution:lang==='ar'?'رفض الحل':'Decline resolution',merchant_request_evidence:lang==='ar'?'طلب أدلة':'Request evidence',merchant_offer_resolution:lang==='ar'?'تقديم حل':'Offer resolution',merchant_reject_case:lang==='ar'?'رفض المطالبة':'Reject claim'} as Record<string,string>)[x]||x;
            const prompt=role==='consumer'?(lang==='ar'?'راجع هذه المطالبة عبر أدوات WebMCP. لخّص الحقائق، افحص الجاهزية، واذكر الإجراء المتاح التالي. لا تنفذ أي إجراء يغيّر الحالة قبل أن تطلب موافقتي.':'Review this claim through its WebMCP tools. Summarize the facts, check readiness, and tell me the next valid action. Do not perform any state-changing action before asking for my approval.'):(lang==='ar'?'راجع مطالبة التاجر عبر WebMCP. افحص الحقائق والأدلة والسجل، ثم اقترح الإجراء المسموح التالي. لا تطلب أدلة أو تقدم حلاً أو ترفض قبل موافقتي.':'Review this merchant claim through WebMCP. Inspect the facts, evidence, and history, then propose the next valid action. Do not request evidence, offer a resolution, or reject before my approval.');
            return <div className='card agentWorkspace'><div className='sectionTitleRow'><div><h2>{lang==='ar'?'مساحة عمل الإنسان + الوكيل':'Human + agent workspace'}</h2><p>{lang==='ar'?'أدوات سياقية حقيقية تتغير حسب نوع الحساب وحالة المطالبة، بدل أن يخمّن الوكيل الواجهة.':'Real contextual tools change with the signed-in role and claim state, so the agent does not have to guess from the UI.'}</p></div><span className={'webmcpBadge '+(connected?'on':'off')}>{connected?(lang==='ar'?'WebMCP متصل':'WebMCP connected'):(lang==='ar'?'بانتظار متصفح WebMCP':'WebMCP browser needed')}</span></div><div className='agentCapabilityGrid'><article><b>{lang==='ar'?'الوكيل يقرأ':'Agent can read'}</b><span>{lang==='ar'?'حقائق العملية، الأدلة، السجل، محاولات التواصل، الجاهزية والعروض.':'Transaction facts, evidence, history, contact attempts, readiness, and offers.'}</span></article><article><b>{lang==='ar'?'الإنسان يقرر':'Human remains in control'}</b><span>{lang==='ar'?'أي إجراء يغيّر حالة المطالبة يحتاج تأكيدًا صريحًا ثم يمر عبر صلاحيات الخادم.':'Every state-changing action requires explicit confirmation and still passes server authorization.'}</span></article></div><div className='agentActionList'><b>{lang==='ar'?'الإجراءات المتاحة الآن':'Actions available now'}</b><div>{actions.length?actions.map(x=><span className='agentActionChip' key={x}>{actionLabel(x)}</span>):<span className='fieldHint'>{lang==='ar'?'لا يوجد إجراء يغيّر الحالة في هذه المرحلة.':'No state-changing action is valid in this state.'}</span>}</div></div><div className='agentPrompt'><span>{lang==='ar'?'اقتراح سريع للوكيل':'Agent starter prompt'}</span><p>{prompt}</p><button className='secondary' onClick={()=>navigator.clipboard.writeText(prompt)}><Copy/>{lang==='ar'?'نسخ':'Copy'}</button></div></div>;
          }
          function FollowUpStatus({lang,c}:{lang:Lang;c:CaseRow}){
            const x=getWorkflowCheckpoint(c);
            const pct=x.checkpointHours?Math.min(100,Math.round(x.elapsedHours/x.checkpointHours*100)):0;
            const headline=x.waitingFor==='merchant'?(x.checkpointReached?(lang==='ar'?'حان وقت مراجعة المتابعة':'Follow-up checkpoint reached'):(lang==='ar'?`متابعة سير العمل بعد ${x.checkpointHours} ساعة`:`${x.checkpointHours}-hour workflow follow-up`)):x.waitingFor==='consumer'?(lang==='ar'?'الإجراء التالي عند المستهلك':'Consumer action is next'):x.waitingFor==='complete'?(lang==='ar'?'مسار المطالبة مكتمل':'Claim workflow complete'):(lang==='ar'?'لم يبدأ انتظار الطرف الآخر':'No counterpart wait is active');
            return <div className='card followUpCard'><div className='sectionTitleRow'><div><h2>{lang==='ar'?'ساعة المتابعة':'Follow-up clock'}</h2><p>{headline}</p></div>{x.waitingFor==='merchant'&&<strong>{x.elapsedHours}h</strong>}</div>{x.waitingFor==='merchant'&&<div className='followProgress'><span style={{width:pct+'%'}}/></div>}<small>{lang==='ar'?`آخر نشاط مسجل: ${new Date(x.latestActivity).toLocaleString('ar-IQ')}. مهلة الـ72 ساعة نقطة متابعة داخل ResolveRelay وليست موعدًا قانونيًا أو تصعيدًا تلقائيًا.`:`Last recorded activity: ${new Date(x.latestActivity).toLocaleString('en')}. The 72-hour mark is a ResolveRelay workflow checkpoint, not a legal deadline or automatic escalation.`}</small></div>;
          }
          function ClaimDossier({lang,c,txn}:{lang:Lang;c:CaseRow;txn?:Txn}){
            const printDossier=()=>{
              const esc=(v:unknown)=>String(v??'—').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'} as Record<string,string>)[ch]);
              const rows=(items:Array<[string,unknown]>)=>items.map(([a,b])=>`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join('');
              const events=[...(c.case_events||[])].sort((a,b)=>a.created_at.localeCompare(b.created_at));
              const evidence=c.evidence||[];const contacts=c.contact_attempts||[];const offers=c.resolution_offers||[];
              const html=`<!doctype html><html lang="${lang}" dir="${lang==='ar'?'rtl':'ltr'}"><head><meta charset="utf-8"><title>ResolveRelay Claim Dossier ${esc(c.id)}</title><style>body{font-family:Arial,sans-serif;color:#17221c;margin:36px;line-height:1.55}h1{margin-bottom:4px}h2{margin-top:28px;border-bottom:1px solid #ccd8d0;padding-bottom:6px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e5ece8;text-align:${lang==='ar'?'right':'left'};vertical-align:top}th{width:32%;color:#52635a}ul{padding-inline-start:22px}.meta{color:#617168}.notice{padding:12px;background:#f2f7f3;border:1px solid #dbe6df;border-radius:8px}.footer{margin-top:30px;font-size:12px;color:#65756d}@media print{body{margin:18mm}.no-print{display:none}}</style></head><body><h1>ResolveRelay — ${lang==='ar'?'ملف المطالبة':'Claim Dossier'}</h1><div class="meta">${esc(c.id)} · ${esc(new Date().toISOString())}</div><p class="notice">${lang==='ar'?'حزمة حقائق مولّدة من سجلات ResolveRelay. ليست استشارة قانونية ولا نموذجًا رسميًا صادرًا من بنك أو جهة حكومية.':'A fact packet generated from ResolveRelay records. It is not legal advice or an official bank/government form.'}</p><h2>${lang==='ar'?'حقائق العملية':'Transaction facts'}</h2><table>${rows([[lang==='ar'?'المستهلك':'Consumer',txn?.consumer_name],[lang==='ar'?'التاجر':'Merchant',txn?.merchant_name],[lang==='ar'?'رقم الطلب':'Order ID',txn?.order_id],[lang==='ar'?'المنتج/الخدمة':'Product/service',txn?.product_service],[lang==='ar'?'المبلغ':'Amount',txn?`${txn.amount} ${txn.currency}`:'—'],[lang==='ar'?'تاريخ الشراء':'Purchase date',txn?.purchase_date],[lang==='ar'?'نوع المشكلة':'Issue type',issueLabel(c.issue_type,c.title,lang)],[lang==='ar'?'الحل المطلوب':'Requested resolution',c.requested_resolution],[lang==='ar'?'الحالة':'Status',c.status]])}</table><h2>${lang==='ar'?'وصف المشكلة':'Problem description'}</h2><p>${esc(c.description)}</p><h2>${lang==='ar'?'فهرس الأدلة':'Evidence index'}</h2>${evidence.length?`<ul>${evidence.map(x=>`<li>${esc(x.file_name)}</li>`).join('')}</ul>`:`<p>—</p>`}<h2>${lang==='ar'?'سجل التواصل':'Contact log'}</h2>${contacts.length?`<ul>${contacts.map(x=>`<li>${esc(new Date(x.contacted_at).toLocaleString(lang==='ar'?'ar-IQ':'en'))} — ${esc(x.channel)} — ${esc(x.outcome)}${x.note?` — ${esc(x.note)}`:''}</li>`).join('')}</ul>`:`<p>—</p>`}<h2>${lang==='ar'?'العروض':'Resolution offers'}</h2>${offers.length?`<ul>${offers.map(x=>`<li>${esc(x.kind)} — ${esc(x.status)}${x.amount?` — ${esc(x.amount)} ${esc(x.currency)}`:''}${x.note?` — ${esc(x.note)}`:''}</li>`).join('')}</ul>`:`<p>—</p>`}<h2>${lang==='ar'?'السجل الزمني':'Audit timeline'}</h2>${events.length?`<ul>${events.map(x=>`<li>${esc(new Date(x.created_at).toLocaleString(lang==='ar'?'ar-IQ':'en'))} — ${esc(eventLabel(x,lang))}</li>`).join('')}</ul>`:`<p>—</p>`}<div class="footer">ResolveRelay · ${lang==='ar'?'تم إنشاؤه من الحالة المشتركة للمطالبة وقت الطباعة.':'Generated from the shared claim state at print time.'}</div></body></html>`;
              const w=window.open('','_blank');if(!w)return;w.opener=null;w.document.open();w.document.write(html);w.document.close();setTimeout(()=>{w.focus();w.print()},180);
            };
            return <div className='card dossierCard'><div><h2>{lang==='ar'?'ملف المطالبة القابل للتصدير':'Exportable claim dossier'}</h2><p>{lang==='ar'?'يجمع حقائق العملية وفهرس الأدلة والتواصل والعروض وسجل الأحداث في مستند واحد محايد.':'Combines transaction facts, evidence index, contacts, offers, and the audit timeline in one neutral document.'}</p></div><button className='secondary' onClick={printDossier}><FileText/>{lang==='ar'?'طباعة / حفظ PDF':'Print / save as PDF'}</button></div>;
          }
          '''
          if 'function AgentWorkspace(' not in s:
            s=s.replace('function CasePage(', helpers+'\nfunction CasePage(', 1)

          s=s.replace("}{consumer&&<label className='evidenceUpload'>", "}{consumer&&!['resolved','rejected','closed'].includes(c.status)&&<label className='evidenceUpload'>", 1)
          old="{consumer&&<ClaimReadiness lang={lang} c={c} txn={txn}/>} {consumer&&<MerchantSupportFinder lang={lang} productUrl={txn?.product_url}/>} {consumer&&<ClaimPackage lang={lang} claim={claimContext} invite={invite}/>}"
          new="{consumer&&<ClaimReadiness lang={lang} c={c} txn={txn}/>}<AgentWorkspace lang={lang} c={c} role={consumer?'consumer':'merchant'}/><FollowUpStatus lang={lang} c={c}/><ClaimDossier lang={lang} c={c} txn={txn}/>{consumer&&<MerchantSupportFinder lang={lang} productUrl={txn?.product_url}/>} {consumer&&<ClaimPackage lang={lang} claim={claimContext} invite={invite}/>}"
          assert old in s, 'case enhancement insertion point missing'
          s=s.replace(old,new,1)
          old="{invite?<div className='linkRow'><input dir='ltr' readOnly value={invite}/><button className='secondary' onClick={()=>navigator.clipboard.writeText(invite)}><Copy/>{t.copy}</button></div>:<button className='secondary' onClick={mkInvite}>{t.generate}</button>}"
          new="{invite?<div className='linkRow'><input dir='ltr' readOnly value={invite}/><button className='secondary' onClick={()=>navigator.clipboard.writeText(invite)}><Copy/>{t.copy}</button></div>:['ready','submitted'].includes(effectiveStatus)?<button className='secondary' onClick={mkInvite}>{t.generate}</button>:<small className='fieldHint'>{lang==='ar'?'دعوة التاجر غير متاحة في حالة المطالبة الحالية.':'Merchant invitation is not available in the current claim state.'}</small>}"
          assert old in s, 'invite button insertion point missing'
          s=s.replace(old,new,1)
          old="{merchant&&<MerchantActions lang={lang} c={c} action={action}/>}"
          new="{merchant&&(['submitted','merchant_viewed','consumer_replied'].includes(effectiveStatus)?<MerchantActions lang={lang} c={c} action={action}/>:<div className='card merchantStateNotice'><h2>{lang==='ar'?'لا يوجد إجراء متاح الآن':'No merchant action is available now'}</h2><p>{lang==='ar'?'الإجراءات تظهر فقط عندما تسمح بها حالة المطالبة. السجل والملف يبقيان متاحين للقراءة.':'Actions appear only when the claim state allows them. The history and dossier remain available for review.'}</p></div>)}"
          assert old in s, 'merchant action state insertion point missing'
          s=s.replace(old,new,1)
          s=s.replace('(document as any).modelContext', 'getModelContext()')

          start=s.index('function useWebMcp(')
          end=s.index('export default App;',start)
          webmcp=r'''function useWebMcp(c:CaseRow|null,profile:any){
            useEffect(()=>{
              const mc=getModelContext();if(!mc||!c||!profile)return;
              const controller=new AbortController();
              const role=profile.role as 'consumer'|'merchant';
              const emptySchema={type:'object',properties:{},additionalProperties:false};
              const reg=(name:string,title:string,description:string,inputSchema:any,readOnly:boolean,handler:(x:any)=>Promise<any>|any)=>{const tool={name,title,description,inputSchema,annotations:{readOnlyHint:readOnly,untrustedContentHint:readOnly},execute:async(raw:any)=>{const args=typeof raw==='string'?JSON.parse(raw||'{}'):raw||{};return handler(args)}};Promise.resolve(mc.registerTool(tool,{signal:controller.signal})).catch((error:any)=>{if(error?.name!=='AbortError')console.warn('WebMCP registration failed:',name,error)})};
              const confirmSchema=(extra:any={})=>({type:'object',properties:{confirmed:{type:'boolean',description:'Set true only after the user explicitly approves this action.'},...extra},additionalProperties:false});
              const confirmWrap=(a:string,payload:(x:any)=>any)=>(x:any)=>x.confirmed===true?fn('case-action',{caseId:c.id,action:a,payload:payload(x)}):Promise.resolve({requiresConfirmation:true,confirmationMessage:`Confirm ${a.replaceAll('_',' ')} for claim ${c.id}?`});
              const availableActions=()=>getRoleActions(role,c.status);
              const dossier=()=>({generatedAt:new Date().toISOString(),disclaimer:'Structured ResolveRelay fact packet; not legal advice or an official bank/government form.',case:{id:c.id,status:c.status,issueType:c.issue_type,description:c.description,requestedResolution:c.requested_resolution,createdAt:c.created_at},transaction:c.transactions?.[0]||null,evidence:(c.evidence||[]).map(x=>({fileName:x.file_name})),contactAttempts:c.contact_attempts||[],offers:c.resolution_offers||[],merchantResponses:c.merchant_responses||[],timeline:c.case_events||[]});
              reg('get_case_context','Get claim context','Get authorized structured context for the current ResolveRelay claim, including purchase facts, evidence filenames, requested outcome, status, and pending offers.',emptySchema,true,async()=>({id:c.id,status:c.status,issueType:c.issue_type,role,description:c.description,transaction:c.transactions?.[0],evidence:c.evidence||[],requestedResolution:c.requested_resolution,contactAttempts:c.contact_attempts||[],offers:c.resolution_offers||[]}));
              reg('get_case_history','Get claim history','Get the authorized audit/event history for the current claim.',emptySchema,true,async()=>c.case_events||[]);
              reg('get_notifications','Get my notifications','Get recent notifications for the signed-in ResolveRelay account.',emptySchema,true,async()=>{const {data,error}=await supabase.from('notifications').select('*').order('created_at',{ascending:false}).limit(20);if(error)throw error;return data||[]});
              reg('get_contact_log','Get external contact log','Get authorized external merchant contact attempts recorded for the current claim. Merchant accounts only receive attempts the consumer explicitly shared.',emptySchema,true,async()=>c.contact_attempts||[]);
              reg('get_available_actions','Get available claim actions','Return the actions currently valid for this signed-in role and claim state. Use this before proposing a state-changing action.',emptySchema,true,async()=>({role,status:c.status,actions:availableActions()}));
              reg('get_claim_readiness','Check claim readiness','Check whether the current claim contains the core facts and evidence needed for a clear merchant-facing claim.',emptySchema,true,async()=>{const txn=c.transactions?.[0];const checks=[['merchant_name',Boolean(txn?.merchant_name)],['order_id',Boolean(txn?.order_id)],['product_service',Boolean(txn?.product_service)],['amount',Boolean(txn?.amount&&txn.amount>0)],['purchase_date',Boolean(txn?.purchase_date)],['description',Boolean(c.description?.trim())],['requested_resolution',Boolean(c.requested_resolution)]];return {complete:checks.every(([,ok])=>ok),missing:checks.filter(([,ok])=>!ok).map(([name])=>name),evidenceAttached:Boolean(c.evidence?.length)}});
              reg('get_follow_up_status','Get follow-up status','Return the neutral ResolveRelay workflow checkpoint derived from the latest recorded activity. The 72-hour checkpoint is not a legal deadline and never triggers external escalation automatically.',emptySchema,true,async()=>getWorkflowCheckpoint(c));
              reg('get_claim_dossier','Get claim dossier','Return a canonical structured fact packet containing transaction facts, evidence index, contact attempts, offers, merchant responses, and audit timeline. It contains no legal conclusions.',emptySchema,true,async()=>dossier());
              if(c.transactions?.[0]?.product_url)reg('find_merchant_support','Find merchant support','Inspect likely support/contact pages on the merchant domain saved with this claim. Returns only pages and emails actually found on that domain.',emptySchema,true,async()=>{const {data}=await api.post('/api/merchant-support',{productUrl:c.transactions?.[0]?.product_url,lang:document.documentElement.lang==='ar'?'ar':'en'});return data});
              if(role==='consumer'){
                reg('log_contact_attempt','Log merchant contact attempt','Record an external contact attempt after explicit user approval. This documents communication; it does not contact the merchant automatically.',confirmSchema({channel:{type:'string',enum:['email','phone','chat','social','marketplace','other']},contactedAt:{type:'string',description:'ISO 8601 date/time of the contact attempt.'},outcome:{type:'string',enum:['no_reply','promised_action','requested_info','declined','resolved','other']},note:{type:'string',maxLength:2000},merchantVisible:{type:'boolean'}}),false,async x=>{if(x.confirmed!==true)return {requiresConfirmation:true,confirmationMessage:'Confirm adding this external contact attempt to the claim record?'};const {error}=await supabase.from('contact_attempts').insert({case_id:c.id,profile_id:profile.id,channel:x.channel||'other',contacted_at:x.contactedAt||new Date().toISOString(),outcome:x.outcome||'other',note:String(x.note||'').slice(0,2000),merchant_visible:Boolean(x.merchantVisible)});if(error)throw error;return {ok:true}});
                if(['ready','submitted'].includes(c.status))reg('create_merchant_invitation','Create merchant invitation','Create a secure, expiring invitation for the merchant. First call without confirmed=true to request human confirmation.',confirmSchema(),false,async x=>x.confirmed===true?fn('merchant-invite',{caseId:c.id}):({requiresConfirmation:true,confirmationMessage:'Confirm creating a merchant invitation for this claim?'}));
                if(c.status==='ready')reg('submit_case_to_merchant','Submit claim to merchant','Submit this ready claim to the merchant. First call without confirmed=true to request human confirmation.',confirmSchema(),false,confirmWrap('submit',()=>({label:'Claim submitted to merchant'})));
                if(c.status==='resolution_offered'){reg('accept_resolution','Accept merchant resolution','Accept the pending merchant resolution. First call without confirmed=true to request human confirmation.',confirmSchema(),false,confirmWrap('accept_offer',()=>({label:'Resolution accepted'})));reg('decline_resolution','Decline merchant resolution','Decline the pending merchant resolution. First call without confirmed=true to request human confirmation.',confirmSchema(),false,confirmWrap('decline_offer',()=>({label:'Resolution declined'})))}
              }
              if(role==='merchant'&&['submitted','merchant_viewed','consumer_replied'].includes(c.status)){
                reg('merchant_request_evidence','Request more evidence','Request specific additional evidence from the consumer. A non-empty message is required and confirmed=true is allowed only after explicit user approval.',confirmSchema({message:{type:'string',minLength:3,maxLength:2000,description:'Specific evidence requested from the consumer.'}}),false,confirmWrap('request_evidence',x=>({message:String(x.message||'').trim(),label:'Evidence requested'})));
                reg('merchant_offer_resolution','Offer resolution','Offer a resolution to the consumer. For partial refunds, amount must be positive and no greater than the purchase amount. confirmed=true is allowed only after explicit user approval.',confirmSchema({kind:{type:'string',enum:['full_refund','partial_refund','replacement','other']},amount:{type:'number',exclusiveMinimum:0},currency:{type:'string',minLength:3,maxLength:3},note:{type:'string',maxLength:2000}}),false,confirmWrap('offer',x=>({kind:x.kind||'full_refund',amount:x.amount??null,currency:x.currency||c.transactions?.[0]?.currency||'USD',note:String(x.note||''),label:'Resolution offered'})));
                reg('merchant_reject_case','Reject claim','Reject the claim with a clear written reason. A non-empty message is required and confirmed=true is allowed only after explicit user approval.',confirmSchema({message:{type:'string',minLength:3,maxLength:2000}}),false,confirmWrap('reject',x=>({message:String(x.message||'').trim(),label:'Claim rejected'})));
              }
              return()=>controller.abort();
            },[c,profile]);
          }
          '''
          s=s[:start]+webmcp+'\nexport default App;'+s[end+len('export default App;'):]
          p.write_text(s)

          css=Path('src/resolverelay.css')
          c=css.read_text()
          addon=r'''
          /* Challenge-focused collaboration surfaces */
          .agentWorkspace{border-color:#bfe1ca;background:linear-gradient(180deg,#fff,#f7fcf8)}.agentCapabilityGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.agentCapabilityGrid article{display:grid;gap:6px;background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px}.agentCapabilityGrid span,.agentWorkspace p,.dossierCard p,.followUpCard small,.merchantStateNotice p{color:var(--muted);line-height:1.65}.agentActionList{display:grid;gap:9px}.agentActionList>div{display:flex;flex-wrap:wrap;gap:7px}.agentActionChip{display:inline-flex;padding:7px 9px;border-radius:999px;background:var(--mintSoft);color:#287443;font-size:11px;font-weight:800}.agentPrompt{margin-top:16px;border:1px dashed #a9cdb5;background:#fff;border-radius:13px;padding:14px;display:grid;gap:9px}.agentPrompt>span{font-size:11px;font-weight:800;color:#47765a}.agentPrompt p{margin:0;white-space:pre-wrap}.agentPrompt button{justify-self:start}.followUpCard strong{font-size:24px;color:#287443}.followProgress{height:8px;background:#edf2ef;border-radius:999px;overflow:hidden;margin:14px 0}.followProgress span{display:block;height:100%;background:var(--mint);border-radius:999px}.dossierCard{display:flex;align-items:center;justify-content:space-between;gap:18px}.dossierCard h2,.dossierCard p,.merchantStateNotice h2,.merchantStateNotice p{margin-top:0}.dossierCard button{flex:none}.merchantStateNotice{background:#fafcfb}.merchantStateNotice p{margin-bottom:0}@media(max-width:760px){.agentCapabilityGrid{grid-template-columns:1fr}.dossierCard{align-items:stretch;flex-direction:column}.dossierCard button,.agentPrompt button{width:100%}}
          '''
          if 'Challenge-focused collaboration surfaces' not in c: css.write_text(c+addon)

          for name in ['README.md','HACKATHON.md']:
            q=Path(name);txt=q.read_text()
            block='''\n\n## Challenge-focused collaboration surfaces\n\n- **Human + Agent Workspace:** every claim now exposes the current WebMCP connection state, the role-aware actions that are valid now, and a starter prompt that demonstrates human-approved agent collaboration.\n- **Claim Dossier:** consumers and merchants can print or save a neutral fact packet as PDF containing transaction facts, evidence index, contact log, offers, and the audit timeline. It is explicitly not legal advice or an official bank/government form.\n- **Follow-up clock:** a 72-hour ResolveRelay workflow checkpoint is derived from the latest recorded activity while waiting for a merchant. It is not a legal deadline and never auto-escalates externally.\n- **WebMCP tools:** `get_follow_up_status` and `get_claim_dossier` expose the same structured state to agents. `log_contact_attempt` is registered immediately for consumer claims rather than only after another tool is called.\n- **State-aware controls:** merchant actions, merchant invitations, and evidence upload controls are hidden/limited when the current state does not permit them, reducing dead-end buttons during judge testing.\n'''
            if '## Challenge-focused collaboration surfaces' not in txt:q.write_text(txt.rstrip()+block+'\n')

          wf=Path('.github/workflows/zz-challenge-polish-one-time.yml')
          wf.unlink(missing_ok=True)
      - name: Validate build
        run: |
          npm ci --no-audit --no-fund
          npm run build
          grep -q 'Human + agent workspace' src/App.tsx
          grep -q "get_claim_dossier" src/App.tsx
          grep -q "get_follow_up_status" src/App.tsx
      - name: Commit focused challenge polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add visible human agent collaboration and claim dossier'
          git push origin main
