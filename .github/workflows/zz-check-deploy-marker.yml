name: Check Netlify deploy marker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-check-deploy-marker.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify then check marker
        run: |
          sleep 90
          set -eux
          curl -fsS --retry 3 --retry-delay 5 'https://resolverelai.netlify.app/rr-deploy-marker.txt?qa='$(date +%s) | tee /tmp/marker
          grep -F 'resolverelay-main-marker-20260831-1219-iraq' /tmp/marker
