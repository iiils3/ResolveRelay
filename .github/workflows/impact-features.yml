name: Apply impact and WebMCP features

on:
  push:
    branches: [main]
    paths:
      - 'scripts/impact-features.mjs'

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply feature transform
        run: node scripts/impact-features.mjs
      - name: Typecheck transformed source
        run: npm run typecheck
      - name: Build transformed source
        run: npm run build
      - name: Commit transformed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/qa-fixes.css
          git diff --cached --quiet || git commit -m 'Add dispute types, contact log, and richer WebMCP actions'
          git push
