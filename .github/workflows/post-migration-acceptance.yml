name: Post-migration live acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-migration-acceptance.yml'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for GitHub Pages
        run: |
          sleep 45
          for i in {1..6}; do
            curl -fsS --max-time 20 https://iiils3.github.io/ResolveRelay/ >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Verify demo auth, role isolation, RLS, and Groq relay
        shell: bash
        run: |
          node <<'NODE'
          const SUP='https://mbhiaqhlhxjibuckdikq.supabase.co';
          const KEY='sb_publishable_AEzTVMOcLg26Q6ZoRw62Dw_jtOCDGCI';
          const j=async(url,opt={})=>{const r=await fetch(url,opt);const text=await r.text();let d;try{d=JSON.parse(text)}catch{d={raw:text}};if(!r.ok)throw new Error(`${r.status} ${JSON.stringify(d)}`);return d};
          const login=role=>j(`${SUP}/functions/v1/demo-login`,{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({role,email:`${role}.${Date.now()}@example.com`,password:`random-${Math.random()}`})});
          const c=await login('consumer');
          const m=await login('merchant');
          const decode=t=>JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());
          const cs=decode(c.session.access_token).sub, ms=decode(m.session.access_token).sub;
          if(!cs||!ms||cs===ms)throw new Error('Consumer and merchant demo sessions are not separated');
          const rest=async(path,token)=>j(`${SUP}/rest/v1/${path}`,{headers:{apikey:KEY,Authorization:`Bearer ${token}`}});
          const cp=await rest(`profiles?id=eq.${cs}&select=role,display_name`,c.session.access_token);
          const mp=await rest(`profiles?id=eq.${ms}&select=role,display_name`,m.session.access_token);
          if(cp?.[0]?.role!=='consumer'||mp?.[0]?.role!=='merchant')throw new Error('Role profiles are wrong');
          const cc=await rest(`cases?consumer_id=eq.${cs}&select=id,status`,c.session.access_token);
          const mm=await rest(`case_members?profile_id=eq.${ms}&role=eq.merchant&revoked_at=is.null&select=case_id`,m.session.access_token);
          if(cc.length<3||mm.length<3)throw new Error('Demo fixtures unavailable');
          const ai=await j(`${SUP}/functions/v1/ai-relay`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${c.session.access_token}`,'content-type':'application/json'},body:JSON.stringify({route:'claim-assist',payload:{task:'neutral_summary',lang:'en',claim:{status:'ready',description:'A paid order did not arrive.',requestedResolution:'full_refund',transaction:{merchant_name:'Northstar Goods',order_id:'NS-48219',amount:149,currency:'USD'}}}})});
          if(typeof ai.text!=='string'||ai.text.trim().length<20)throw new Error('Groq relay returned no usable text');
          console.log('Backend acceptance passed after RLS migration.');
          NODE
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live UI on desktop and mobile
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const browser=await chromium.launch({headless:true});

          const consumerContext=await browser.newContext({viewport:{width:1440,height:900}});
          await consumerContext.addInitScript(()=>localStorage.setItem('rr-lang','en'));
          const consumer=await consumerContext.newPage();
          await consumer.goto('https://iiils3.github.io/ResolveRelay/#/auth',{waitUntil:'networkidle'});
          await consumer.getByRole('heading',{name:'Demo access'}).waitFor();
          const bodyText=await consumer.locator('body').innerText();
          assert(!/hackathon|competition/i.test(bodyText),'Competition wording is visible in product UI');
          await consumer.getByRole('button',{name:/Consumer/}).click();
          await consumer.locator('input[type=email]').fill('anything.consumer@example.com');
          await consumer.locator('input[type=password]').fill('anything');
          await consumer.getByRole('button',{name:'Enter as consumer'}).click();
          await consumer.waitForURL(/#\/dashboard/,{timeout:20000});
          await consumer.getByText('Demo Consumer',{exact:true}).waitFor();
          await consumer.locator('.caseTile').first().waitFor({timeout:15000});
          assert(await consumer.locator('.caseTile').count()>=3,'Consumer demo claims missing');
          await consumer.locator('.caseTile').first().click();
          await consumer.waitForURL(/#\/claim\//,{timeout:10000});
          await consumer.getByText('Transaction Passport',{exact:true}).first().waitFor();
          const aiResponsePromise=consumer.waitForResponse(r=>r.url().includes('/functions/v1/ai-relay')&&r.request().method()==='POST',{timeout:30000});
          await consumer.getByRole('button',{name:'Neutral summary'}).click();
          const aiResponse=await aiResponsePromise;
          assert(aiResponse.status()===200,`Live AI HTTP ${aiResponse.status()}`);
          const aiData=await aiResponse.json();
          assert(typeof aiData?.text==='string'&&aiData.text.trim().length>20,'Live AI quick action returned no usable text');
          await consumerContext.close();

          const merchantContext=await browser.newContext({viewport:{width:1440,height:900}});
          await merchantContext.addInitScript(()=>localStorage.setItem('rr-lang','en'));
          const merchant=await merchantContext.newPage();
          await merchant.goto('https://iiils3.github.io/ResolveRelay/#/auth',{waitUntil:'networkidle'});
          await merchant.getByRole('heading',{name:'Demo access'}).waitFor();
          await merchant.getByRole('button',{name:/Merchant/}).click();
          await merchant.locator('input[type=email]').fill('anything.merchant@example.com');
          await merchant.locator('input[type=password]').fill('different');
          await merchant.getByRole('button',{name:'Enter as merchant'}).click();
          await merchant.waitForURL(/#\/dashboard/,{timeout:20000});
          await merchant.getByText('Demo Merchant',{exact:true}).waitFor();
          await merchant.locator('.caseTile').first().waitFor({timeout:15000});
          assert(await merchant.locator('.caseTile').count()>=3,'Merchant assigned claims missing');
          await merchantContext.close();

          const mobileContext=await browser.newContext({viewport:{width:390,height:844}});
          await mobileContext.addInitScript(()=>localStorage.setItem('rr-lang','en'));
          const mobile=await mobileContext.newPage();
          await mobile.goto('https://iiils3.github.io/ResolveRelay/#/auth',{waitUntil:'networkidle'});
          await mobile.getByRole('heading',{name:'Demo access'}).waitFor();
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
          assert(overflow<=2,`Mobile horizontal overflow: ${overflow}px`);
          const mobileText=await mobile.locator('body').innerText();
          assert(!/hackathon|competition/i.test(mobileText),'Competition wording visible on mobile');
          await mobileContext.close();
          await browser.close();
          console.log('Live browser acceptance passed after RLS migration.');
          NODE
