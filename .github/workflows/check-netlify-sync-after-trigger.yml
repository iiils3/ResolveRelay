name: Check Netlify deploy credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-netlify-sync-after-trigger.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HAS_NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
      HAS_NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID != '' }}
    steps:
      - name: Check credential presence only
        run: |
          echo "HAS_NETLIFY_AUTH_TOKEN=$HAS_NETLIFY_AUTH_TOKEN"
          echo "HAS_NETLIFY_SITE_ID=$HAS_NETLIFY_SITE_ID"
