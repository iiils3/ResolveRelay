name: Check Netlify deploy credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-netlify-sync-after-trigger.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_PROD_DEPLOY_HOOK: ${{ secrets.NETLIFY_PROD_DEPLOY_HOOK }}
    steps:
      - name: Check credential presence only
        shell: bash
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then echo 'HAS_NETLIFY_AUTH_TOKEN=true'; else echo 'HAS_NETLIFY_AUTH_TOKEN=false'; fi
          if [ -n "$NETLIFY_SITE_ID" ]; then echo 'HAS_NETLIFY_SITE_ID=true'; else echo 'HAS_NETLIFY_SITE_ID=false'; fi
          if [ -n "$NETLIFY_PROD_DEPLOY_HOOK" ]; then echo 'HAS_NETLIFY_PROD_DEPLOY_HOOK=true'; else echo 'HAS_NETLIFY_PROD_DEPLOY_HOOK=false'; fi
