name: Apply demo mode

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-demo-mode.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-demo-mode.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit transformed app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Enable role-separated demo access'
          git push
