name: Hackathon Finalize

on:
  push:
    branches: [hackathon-final]
    paths:
      - 'scripts/hackathon-finalize.mjs'
      - '.github/workflows/hackathon-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hackathon finalization
        run: node scripts/hackathon-finalize.mjs
      - name: Fix TypeScript baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace('FormEvent, useCallback, useEffect, useMemo, useState','FormEvent, useCallback, useEffect, useState')
          s=s.replace('Check, ChevronLeft, ChevronRight, Copy','Check, ChevronLeft, Copy')
          p.write_text(s)
          t=Path('tsconfig.json')
          x=t.read_text().replace('"target": "ES2020"','"target": "ES2021"').replace('"ES2020", "DOM"','"ES2021", "DOM"')
          t.write_text(x)
          Path('src/appdeploy-client.d.ts').write_text("declare module '@appdeploy/client' {\n  export const api: {\n    post(path: string, body?: unknown): Promise<{ data: any }>;\n    get(path: string): Promise<{ data: any }>;\n  };\n}\n")
          PY
      - name: Install dependencies and lock versions
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
      - name: Validate Netlify function
        run: npx esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --outfile=/tmp/resolverelay-netlify-api.mjs
      - name: Dependency audit summary
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log('audit', JSON.stringify(a.metadata?.vulnerabilities||{}));"
      - name: Commit finalized app
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/qa-fixes.css src/appdeploy-client.d.ts tsconfig.json package-lock.json
          git commit -m 'Harden WebMCP and claim resolution flow'
          git push origin HEAD:hackathon-final
