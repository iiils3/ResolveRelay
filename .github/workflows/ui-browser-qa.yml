name: UI Browser QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ui-browser-qa.mjs'
      - '.github/workflows/ui-browser-qa.yml'

jobs:
  ui-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for Netlify deployment
        run: sleep 55
      - name: Run desktop and mobile UI QA
        run: node scripts/ui-browser-qa.mjs
      - name: Upload UI QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolverelay-ui-qa
          path: ui-qa-artifacts
          if-no-files-found: ignore
