name: Apply UI QA Fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ui-qa-fixes.mjs'
      - '.github/workflows/apply-ui-qa-fixes.yml'

permissions:
  contents: write

jobs:
  apply-ui-qa-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch one generated-string escape
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-ui-qa-fixes.mjs')
          s = p.read_text()
          s = s.replace(r"claim\'s current state", r"claim\\'s current state")
          p.write_text(s)
          PY
      - name: Apply UI QA transformation
        run: node scripts/apply-ui-qa-fixes.mjs
      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --outfile=/tmp/resolverelay-netlify-api.mjs
      - name: Commit UI QA fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/main.tsx src/qa-fixes.css
          git commit -m 'Polish claim UX and evidence handling'
          git push
