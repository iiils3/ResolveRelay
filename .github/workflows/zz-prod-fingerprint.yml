name: Production fingerprint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-prod-fingerprint.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Netlify production bundle
        shell: python
        run: |
          import re, urllib.request, urllib.parse, time
          base='https://resolverelai.netlify.app/'
          stamp=str(int(time.time()))
          req=urllib.request.Request(base+'?rrqa='+stamp,headers={'Cache-Control':'no-cache','User-Agent':'ResolveRelay-QA'})
          html=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          print('HTML_HEAD='+html[:1200].replace('\n',' '))
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+\.js[^"\']*)["\']',html)
          print('SCRIPT_REFS='+repr(refs))
          if not refs: raise SystemExit('No script bundle found')
          asset=urllib.parse.urljoin(base,refs[-1])
          sep='&' if '?' in asset else '?'
          js=urllib.request.urlopen(urllib.request.Request(asset+sep+'rrqa='+stamp,headers={'Cache-Control':'no-cache','User-Agent':'ResolveRelay-QA'}),timeout=30).read().decode('utf-8','replace')
          markers={
            'demo_access':'Demo access' in js,
            'role_choice':'roleChoice' in js,
            'explicit_offer_query':'resolution_offers' in js and 'merchant_responses' in js,
            'webmcp':'registerTool' in js or 'modelContext' in js,
            'contact_log':'log_contact_attempt' in js,
          }
          print('LIVE_ASSET='+asset)
          print('BUNDLE_BYTES='+str(len(js)))
          print('MARKERS='+repr(markers))
          if not all(markers.values()): raise SystemExit('Production bundle is missing current markers')
          print('PRODUCTION_FINGERPRINT_OK')
