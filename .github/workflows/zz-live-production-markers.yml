name: Verify live production markers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-live-production-markers.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Netlify live bundle markers
        shell: python
        run: |
          import re, urllib.request, time
          base='https://resolverelai.netlify.app'
          h=urllib.request.urlopen(urllib.request.Request(base+'/?qa='+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'ResolveRelay-QA'}),timeout=30).read().decode('utf-8','replace')
          m=re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']',h)
          assert m, 'live bundle ref missing'
          ref=m.group(1)
          js=urllib.request.urlopen(urllib.request.Request(base+'/'+ref.lstrip('./')+'?qa='+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'ResolveRelay-QA'}),timeout=30).read().decode('utf-8','replace')
          markers=['Demo access','Choose an account type','resolution_offers','merchant_responses','case_events','Two parties, one audit trail']
          print('LIVE_JS='+ref)
          for marker in markers:
            ok=marker in js
            print(marker+': '+str(ok))
            if not ok: raise SystemExit('missing marker: '+marker)
          print('PRODUCTION_MARKERS_OK=true')
