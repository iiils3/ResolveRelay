name: Check Netlify frontend fingerprint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-netlify-frontend-fingerprint.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 20 https://resolverelai.netlify.app/)"
          asset="$(printf '%s' "$html" | grep -oE '/assets/[^"'"']+\.js' | head -n1)"
          test -n "$asset"
          js="$(curl -fsS --max-time 30 "https://resolverelai.netlify.app${asset}")"
          echo "LIVE_ASSET=$asset"
          if printf '%s' "$js" | grep -q 'Demo access'; then
            echo 'NETLIFY_FRONTEND_CURRENT=true'
          else
            echo 'NETLIFY_FRONTEND_CURRENT=false'
            exit 2
          fi
