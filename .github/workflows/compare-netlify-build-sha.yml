name: Compare Netlify bundle with main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-netlify-build-sha.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build exact main
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Compare bundle hashes
        shell: python
        run: |
          import re, pathlib, hashlib, urllib.request, time
          base='https://resolverelai.netlify.app'
          local_html=pathlib.Path('dist/index.html').read_text()
          lm=re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']',local_html)
          if not lm: raise SystemExit('local JS ref missing')
          local_ref=lm.group(1)
          local_path=pathlib.Path('dist')/local_ref.lstrip('./')
          local_bytes=local_path.read_bytes()
          live_html=urllib.request.urlopen(urllib.request.Request(base+'/?sha='+str(int(time.time())),headers={'Cache-Control':'no-cache'}),timeout=20).read().decode()
          rm=re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']',live_html)
          if not rm: raise SystemExit('live JS ref missing')
          live_ref=rm.group(1)
          live_url=base+'/'+live_ref.lstrip('./')
          live_bytes=urllib.request.urlopen(urllib.request.Request(live_url+'?sha='+str(int(time.time())),headers={'Cache-Control':'no-cache'}),timeout=30).read()
          lh=hashlib.sha256(local_bytes).hexdigest()
          rh=hashlib.sha256(live_bytes).hexdigest()
          print('LOCAL_REF='+local_ref)
          print('LIVE_REF='+live_ref)
          print('LOCAL_SHA256='+lh)
          print('LIVE_SHA256='+rh)
          print('MAIN_EQUALS_NETLIFY='+str(lh==rh).lower())
          if lh!=rh: raise SystemExit(3)
