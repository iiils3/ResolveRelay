name: Final Live Backend QA

on:
  push:
    branches: [hackathon-final]
    paths:
      - '.github/workflows/backend-final-qa.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align legacy QA assertions with hardened server messages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/production-e2e.mjs')
          s=p.read_text()
          old="assert(String(invalidOffer?.error || '').toLowerCase().includes('positive amount'), 'zero partial refund was not rejected');"
          new="""const invalidOfferText=String(invalidOffer?.error || '').toLowerCase();
          assert(invalidOfferText.includes('positive') && invalidOfferText.includes('amount'), 'zero partial refund was not rejected');
          const tooLargeOffer = await caseAction(merchant.access_token, caseC, 'offer', { kind: 'partial_refund', amount: 9999, currency: 'USD' }, { expectError: true });
          assert(String(tooLargeOffer?.error || '').toLowerCase().includes('exceed'), 'partial refund above purchase amount was not rejected');"""
          if old not in s:
              raise SystemExit('legacy assertion not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Run live Supabase consumer-to-merchant E2E
        run: node scripts/production-e2e.mjs
