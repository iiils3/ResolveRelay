name: Inspect Netlify live HTML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-netlify-live-html.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production HTML and assets
        shell: python
        run: |
          import re, urllib.request, urllib.error, time
          base='https://resolverelai.netlify.app'
          req=urllib.request.Request(base+'/?qa='+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'ResolveRelay-QA'})
          html=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          print('HTML_BEGIN')
          print(html[:5000])
          print('HTML_END')
          refs=re.findall(r'(?:src|href)=["\']([^"\']+)["\']',html)
          for ref in refs:
              if not ('.js' in ref or '.css' in ref):
                  continue
              if ref.startswith('http'): url=ref
              elif ref.startswith('/'): url=base+ref
              else: url=base+'/'+ref.lstrip('./')
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url+'?qa='+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'ResolveRelay-QA'}),timeout=20)
                  body=r.read()
                  print('ASSET',ref,'URL',url,'STATUS',r.status,'BYTES',len(body),'DEMO',b'Demo access' in body,'ROLE',b'roleChoice' in body)
              except urllib.error.HTTPError as e:
                  print('ASSET',ref,'URL',url,'STATUS',e.code)
