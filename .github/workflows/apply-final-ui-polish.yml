name: Apply Final UI Polish

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-final-ui-polish.mjs'
      - '.github/workflows/apply-final-ui-polish.yml'

permissions:
  contents: write

jobs:
  apply-final-ui-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final UI polish
        run: node scripts/apply-final-ui-polish.mjs
      - name: Verify no native browser prompts remain
        run: |
          if grep -nE '\b(confirm|alert)\s*\(' src/App.tsx; then
            echo 'Native browser prompt found.'
            exit 1
          fi
      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --outfile=/tmp/resolverelay-netlify-api.mjs
      - name: Commit final UI polish
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/qa-fixes.css
          git commit -m 'Polish notifications and confirmation UX'
          git push
