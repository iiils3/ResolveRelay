name: Final WebMCP Polish

on:
  push:
    branches: [hackathon-final]
    paths:
      - '.github/workflows/final-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final WebMCP and UI polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="annotations:{readOnlyHint:readOnly}"
          new="annotations:{readOnlyHint:readOnly,untrustedContentHint:readOnly}"
          if old not in s:
              raise SystemExit('WebMCP annotations marker not found')
          s=s.replace(old,new,1)
          old2="const validAmount=!partial||Number(amount)>0;"
          new2="const purchaseAmount=Number(c.transactions?.[0]?.amount||0);const validAmount=!partial||(Number(amount)>0&&Number(amount)<=purchaseAmount);"
          if old2 not in s:
              raise SystemExit('merchant amount validation marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Polish WebMCP trust annotations and offer validation'
          git push origin HEAD:hackathon-final
