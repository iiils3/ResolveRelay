name: Strict role backend fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strict-role-backend-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend role isolation
        shell: python
        run: |
          from pathlib import Path

          p=Path('supabase/functions/case-action/index.ts')
          s=p.read_text()
          old="""    const{data:profile}=await service.from('profiles').select('role').eq('id',user.id).single();
    let role=record.consumer_id===user.id?'consumer':null;
    if(profile?.role==='merchant'){
      const{data:membership}=await service.from('case_members').select('id').eq('case_id',caseId).eq('profile_id',user.id).is('revoked_at',null).maybeSingle();
      if(membership)role='merchant';
    }
"""
          new="""    const{data:profile,error:profileError}=await service.from('profiles').select('role').eq('id',user.id).single();
    if(profileError||!profile)throw new Error('Profile is unavailable');
    let role:'consumer'|'merchant'|null=null;
    if(profile.role==='consumer'&&record.consumer_id===user.id)role='consumer';
    if(profile.role==='merchant'){
      const{data:members,error:membershipError}=await service.from('case_members').select('id').eq('case_id',caseId).eq('profile_id',user.id).eq('role','merchant').is('revoked_at',null).limit(1);
      if(membershipError)throw new Error(`Membership check failed: ${membershipError.message}`);
      if(members?.length)role='merchant';
    }
"""
          assert old in s, 'case-action role block not found'
          s=s.replace(old,new,1)
          old="""    const recipient=role==='merchant'
      ?record.consumer_id
      :(await service.from('case_members').select('profile_id').eq('case_id',caseId).eq('role','merchant').is('revoked_at',null).maybeSingle()).data?.profile_id;
"""
          new="""    let recipient:string|undefined;
    if(role==='merchant')recipient=record.consumer_id;
    else{
      const{data:merchantMembers}=await service.from('case_members').select('profile_id').eq('case_id',caseId).eq('role','merchant').is('revoked_at',null).not('profile_id','is',null).limit(1);
      recipient=merchantMembers?.[0]?.profile_id??undefined;
    }
"""
          assert old in s, 'case-action recipient block not found'
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('supabase/functions/redeem-invite/index.ts')
          s=p.read_text()
          old="if(!invite||invite.revoked_at||invite.accepted_at||!invite.invite_expires_at||new Date(invite.invite_expires_at)<new Date())throw new Error('Invitation is invalid or expired');let{data:merchant}=await service.from('merchants').select('id').eq('owner_profile_id',user.id).maybeSingle();"
          new="if(!invite||invite.revoked_at||invite.accepted_at||!invite.invite_expires_at||new Date(invite.invite_expires_at)<new Date())throw new Error('Invitation is invalid or expired');const{data:activeMembers,error:activeMemberError}=await service.from('case_members').select('id,profile_id').eq('case_id',invite.case_id).eq('role','merchant').is('revoked_at',null).not('profile_id','is',null).limit(1);if(activeMemberError)throw activeMemberError;const existingMerchantMember=activeMembers?.[0]||null;if(existingMerchantMember&&existingMerchantMember.profile_id!==user.id)throw new Error('This claim is already assigned to another merchant account');let{data:merchant}=await service.from('merchants').select('id').eq('owner_profile_id',user.id).maybeSingle();"
          assert old in s, 'redeem active-member insertion point not found'
          s=s.replace(old,new,1)
          old="await service.from('case_members').update({profile_id:user.id,merchant_id:null,accepted_at:new Date().toISOString(),token_used_at:new Date().toISOString(),invite_token_hash:null}).eq('id',invite.id);await service.from('cases').update({merchant_id:merchant.id}).eq('id',invite.case_id);"
          new="if(existingMerchantMember){await service.from('case_members').update({revoked_at:new Date().toISOString(),token_used_at:new Date().toISOString(),invite_token_hash:null}).eq('id',invite.id)}else{const membershipUpdate=await service.from('case_members').update({profile_id:user.id,merchant_id:null,accepted_at:new Date().toISOString(),token_used_at:new Date().toISOString(),invite_token_hash:null}).eq('id',invite.id);if(membershipUpdate.error)throw membershipUpdate.error}await service.from('cases').update({merchant_id:merchant.id}).eq('id',invite.case_id);"
          assert old in s, 'redeem membership update not found'
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Sanity checks
        run: |
          grep -q "profile.role==='consumer'" supabase/functions/case-action/index.ts
          grep -q "already assigned to another merchant" supabase/functions/redeem-invite/index.ts
      - name: Commit backend role isolation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/case-action/index.ts supabase/functions/redeem-invite/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce backend consumer merchant boundaries'
          git push origin main
