name: Strict two-role isolation acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strict-role-isolation-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for latest GitHub Pages build
        run: |
          sleep 55
          for i in {1..8}; do
            curl -fsS --max-time 20 https://iiils3.github.io/ResolveRelay/ >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Verify backend role boundaries and invite redemption
        shell: bash
        run: |
          node <<'NODE'
          const SUP='https://mbhiaqhlhxjibuckdikq.supabase.co';
          const KEY='sb_publishable_AEzTVMOcLg26Q6ZoRw62Dw_jtOCDGCI';
          const CASE='9f52d6ab-23a1-4ef0-b3f0-000000000001';
          const TOKEN='rr-strict-role-qa-20260830';
          const req=async(url,opt={})=>{const r=await fetch(url,opt);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data={raw:text}};return {r,data}};
          const must=async(url,opt={})=>{const x=await req(url,opt);if(!x.r.ok)throw new Error(`${x.r.status} ${JSON.stringify(x.data)}`);return x.data};
          const login=role=>must(`${SUP}/functions/v1/demo-login`,{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({role,email:`${role}.${Date.now()}@example.com`,password:'arbitrary-password'})});
          const c=await login('consumer');
          const m=await login('merchant');
          const decode=t=>JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());
          const cid=decode(c.session.access_token).sub,mid=decode(m.session.access_token).sub;
          if(!cid||!mid||cid===mid)throw new Error('Role identities are not separated');
          const rest=async(path,token)=>must(`${SUP}/rest/v1/${path}`,{headers:{apikey:KEY,Authorization:`Bearer ${token}`}});
          const before=await rest(`cases?id=eq.${CASE}&select=id`,m.session.access_token);
          if(before.length!==0)throw new Error('Merchant could access claim before invitation redemption');
          const own=await rest(`cases?id=eq.${CASE}&select=id,consumer_id,status`,c.session.access_token);
          if(own.length!==1||own[0].consumer_id!==cid)throw new Error('Consumer cannot access own QA claim');
          const redeemed=await must(`${SUP}/functions/v1/redeem-invite`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${m.session.access_token}`,'content-type':'application/json'},body:JSON.stringify({token:TOKEN})});
          if(redeemed.caseId!==CASE)throw new Error('Invite did not redeem to expected claim');
          const after=await rest(`cases?id=eq.${CASE}&select=id,status`,m.session.access_token);
          if(after.length!==1)throw new Error('Assigned merchant cannot access claim');
          const members=await rest(`case_members?case_id=eq.${CASE}&role=eq.merchant&revoked_at=is.null&select=profile_id`,m.session.access_token);
          if(members.length!==1||members[0].profile_id!==mid)throw new Error(`Expected one active merchant membership, got ${members.length}`);
          const action=async(token,action,payload={})=>req(`${SUP}/functions/v1/case-action`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({caseId:CASE,action,payload})});
          const badConsumer=await action(c.session.access_token,'offer',{kind:'full_refund',note:'must fail'});
          if(badConsumer.r.ok)throw new Error('Consumer was allowed to execute a merchant action');
          const badMerchant=await action(m.session.access_token,'accept_offer',{label:'must fail'});
          if(badMerchant.r.ok)throw new Error('Merchant was allowed to execute a consumer action');
          const ai=await must(`${SUP}/functions/v1/ai-relay`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${c.session.access_token}`,'content-type':'application/json'},body:JSON.stringify({route:'claim-assist',payload:{task:'neutral_summary',lang:'en',claim:{id:CASE,status:'submitted',description:'Strict role isolation regression fixture.',requestedResolution:'full_refund',transaction:{merchant_name:'Isolation Test Store',order_id:'RR-ROLE-QA',amount:49,currency:'USD'}}}})});
          if(typeof ai.text!=='string'||ai.text.trim().length<20)throw new Error('Consumer Groq relay failed');
          console.log('Backend role isolation passed: pre-invite denial, invite redemption, one merchant, cross-role action denial, Groq.');
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reproduce merchant-offer / consumer-return scenario in real browsers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const SUP='https://mbhiaqhlhxjibuckdikq.supabase.co';
          const KEY='sb_publishable_AEzTVMOcLg26Q6ZoRw62Dw_jtOCDGCI';
          const BASE='https://iiils3.github.io/ResolveRelay/';
          const CASE='9f52d6ab-23a1-4ef0-b3f0-000000000001';
          const MARKER='PRIVATE-CONSUMER-CHAT-ROLE-ISOLATION-8291';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const loginApi=async role=>{const r=await fetch(`${SUP}/functions/v1/demo-login`,{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({role,email:`browser.${role}.${Date.now()}@example.com`,password:'anything'})});const d=await r.json();if(!r.ok)throw new Error(JSON.stringify(d));return d};
          const browser=await chromium.launch({headless:true});
          const loginUi=async(page,role)=>{
            await page.goto(`${BASE}#/auth`,{waitUntil:'networkidle'});
            await page.getByRole('heading',{name:'Demo access'}).waitFor();
            await page.getByRole('button',{name:new RegExp(role,'i')}).click();
            await page.locator('input[type=email]').fill(`${role}.${Date.now()}@example.com`);
            await page.locator('input[type=password]').fill('anything');
            await page.getByRole('button',{name:new RegExp(`Enter as ${role}`,'i')}).click();
            await page.waitForURL(/#\/dashboard/,{timeout:20000});
          };

          // Browser A: consumer, with a private AI conversation marker.
          const consumerCtx=await browser.newContext({viewport:{width:1440,height:900}});
          await consumerCtx.addInitScript(()=>localStorage.setItem('rr-lang','en'));
          const consumer=await consumerCtx.newPage();
          await loginUi(consumer,'consumer');
          await consumer.goto(`${BASE}#/claim/${CASE}`,{waitUntil:'networkidle'});
          await consumer.getByText('Transaction Passport',{exact:true}).waitFor();
          await consumer.getByText('Claim assistant',{exact:true}).waitFor();
          assert(await consumer.getByText('Merchant actions',{exact:true}).count()===0,'Consumer UI contains merchant controls before offer');
          await consumer.getByRole('button',{name:'Use AI assistant'}).click();
          const composer=consumer.locator('.aiDrawer textarea').last();
          await composer.fill(MARKER);
          const chatResp=consumer.waitForResponse(r=>r.url().includes('/functions/v1/ai-relay')&&r.request().method()==='POST',{timeout:30000});
          await consumer.getByRole('button',{name:'Send',exact:true}).click();
          const chatHttp=await chatResp;
          assert(chatHttp.status()===200,`Consumer chat HTTP ${chatHttp.status()}`);
          await consumer.getByText(MARKER,{exact:true}).waitFor();
          await consumer.getByRole('button',{name:'Close'}).click().catch(async()=>{await consumer.locator('.aiClose').click()});

          // Browser B: merchant on the exact same claim.
          const merchantCtx=await browser.newContext({viewport:{width:1440,height:900}});
          await merchantCtx.addInitScript(()=>localStorage.setItem('rr-lang','en'));
          const merchant=await merchantCtx.newPage();
          await loginUi(merchant,'merchant');
          await merchant.goto(`${BASE}#/claim/${CASE}`,{waitUntil:'networkidle'});
          await merchant.getByText('Transaction Passport',{exact:true}).waitFor();
          await merchant.getByText('Merchant actions',{exact:true}).waitFor({timeout:15000});
          assert(await merchant.getByText('Claim assistant',{exact:true}).count()===0,'Merchant can see consumer AI assistant');
          assert(await merchant.getByRole('button',{name:'Use AI assistant'}).count()===0,'Merchant has consumer AI button');
          assert(!(await merchant.locator('body').innerText()).includes(MARKER),'Merchant can see consumer private AI conversation');
          assert(await merchant.getByRole('button',{name:'Accept offer'}).count()===0,'Merchant has consumer offer-response controls');

          // Merchant sends a resolution while Consumer remains open.
          const mSession=await loginApi('merchant');
          const offer=await fetch(`${SUP}/functions/v1/case-action`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${mSession.session.access_token}`,'content-type':'application/json'},body:JSON.stringify({caseId:CASE,action:'offer',payload:{kind:'full_refund',note:'Strict isolation QA resolution',label:'Resolution offered'}})});
          const offerData=await offer.json();
          if(!offer.ok)throw new Error(`Merchant offer failed ${offer.status}: ${JSON.stringify(offerData)}`);

          // Consumer must remain consumer after merchant state change.
          await consumer.goto(`${BASE}#/claim/${CASE}`,{waitUntil:'networkidle'});
          await consumer.getByText('Claim assistant',{exact:true}).waitFor();
          await consumer.getByRole('button',{name:'Accept offer'}).waitFor({timeout:15000});
          assert(await consumer.getByText('Merchant actions',{exact:true}).count()===0,'Consumer morphed into merchant UI after merchant offer');
          assert(await consumer.getByRole('button',{name:'Offer resolution'}).count()===0,'Consumer has merchant offer control after merchant offer');
          await consumer.getByRole('button',{name:'Use AI assistant'}).click();
          await consumer.getByText(MARKER,{exact:true}).waitFor();
          await consumer.locator('.aiClose').click();

          // Merchant must still never receive consumer-only resolution response or AI UI.
          await merchant.goto(`${BASE}#/claim/${CASE}`,{waitUntil:'networkidle'});
          assert(await merchant.getByText('Claim assistant',{exact:true}).count()===0,'Merchant AI assistant appeared after offer');
          assert(await merchant.getByRole('button',{name:'Accept offer'}).count()===0,'Merchant can accept its own offer through consumer UI');
          assert(!(await merchant.locator('body').innerText()).includes(MARKER),'Private consumer chat leaked after offer');

          // Same browser storage: switch Consumer context to Merchant identity.
          await consumer.goto(`${BASE}#/dashboard`,{waitUntil:'networkidle'});
          await consumer.getByRole('button',{name:/Sign out/i}).click();
          await consumer.waitForTimeout(500);
          await loginUi(consumer,'merchant');
          await consumer.goto(`${BASE}#/claim/${CASE}`,{waitUntil:'networkidle'});
          await consumer.getByText('Transaction Passport',{exact:true}).waitFor();
          assert(await consumer.getByText('Claim assistant',{exact:true}).count()===0,'Same-browser role switch leaked consumer AI UI');
          assert(!(await consumer.locator('body').innerText()).includes(MARKER),'Same-browser role switch leaked private chat text');
          const merchantSession=await consumer.evaluate(()=>Object.keys(localStorage).filter(k=>k.startsWith('rr-chat-')));
          assert(merchantSession.some(k=>k.includes(CASE)),'Consumer private chat key unexpectedly missing from browser test setup');

          // Mobile smoke test after strict split.
          const mobileCtx=await browser.newContext({viewport:{width:390,height:844}});
          await mobileCtx.addInitScript(()=>localStorage.setItem('rr-lang','en'));
          const mobile=await mobileCtx.newPage();
          await loginUi(mobile,'consumer');
          await mobile.goto(`${BASE}#/claim/${CASE}`,{waitUntil:'networkidle'});
          await mobile.getByText('Claim assistant',{exact:true}).waitFor();
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
          assert(overflow<=2,`Mobile horizontal overflow ${overflow}px`);
          assert(await mobile.getByText('Merchant actions',{exact:true}).count()===0,'Mobile consumer UI contains merchant controls');

          await consumerCtx.close();await merchantCtx.close();await mobileCtx.close();await browser.close();
          console.log('STRICT_ROLE_ISOLATION_OK: two browsers, merchant offer, consumer return, private AI chat, same-browser switch, mobile.');
          NODE
