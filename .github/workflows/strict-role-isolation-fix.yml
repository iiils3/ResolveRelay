name: Strict role isolation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strict-role-isolation-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply strict role boundaries
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()

          old="useEffect(()=>{if(!session){setProfile(null);return}supabase.from('profiles').select('*').eq('id',session.user.id).maybeSingle().then(({data})=>setProfile(data))},[session]);"
          new="useEffect(()=>{let cancelled=false;setProfile(null);if(!session)return()=>{cancelled=true};const userId=session.user.id;supabase.from('profiles').select('*').eq('id',userId).maybeSingle().then(({data})=>{if(!cancelled&&data?.id===userId)setProfile(data)});return()=>{cancelled=true}},[session?.user.id]);"
          assert old in s, 'profile session effect not found'
          s=s.replace(old,new,1)

          old="const [chat,setChat]=useState<Array<{role:'user'|'assistant';content:string}>>(()=>{try{return JSON.parse(localStorage.getItem('rr-chat-'+id)||'[]')}catch{return []}});const [chatInput,setChatInput]=useState('');"
          new="const [chat,setChat]=useState<Array<{role:'user'|'assistant';content:string}>>([]);const chatKey=session?.user.id?`rr-chat-${session.user.id}-${id}`:'';useEffect(()=>{localStorage.removeItem('rr-chat-'+id);if(!chatKey){setChat([]);return}try{setChat(JSON.parse(localStorage.getItem(chatKey)||'[]'))}catch{setChat([])}},[chatKey,id]);const [chatInput,setChatInput]=useState('');"
          assert old in s, 'chat state not found'
          s=s.replace(old,new,1)

          old="const persistChat=(rows:Array<{role:'user'|'assistant';content:string}>)=>{setChat(rows);localStorage.setItem('rr-chat-'+id,JSON.stringify(rows))};const load=useCallback(()=>loadCase(id).then(setC).catch(()=>setErr(t.notFound)),[id,t.notFound]);useEffect(()=>{if(!session){sessionStorage.setItem('rr-next','/claim/'+id);go('/auth');return}load();const ch=supabase.channel('case-'+id).on('postgres_changes',{event:'*',schema:'public',table:'cases',filter:`id=eq.${id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'case_events',filter:`case_id=eq.${id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'resolution_offers',filter:`case_id=eq.${id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'contact_attempts',filter:`case_id=eq.${id}`},load).subscribe();return()=>{supabase.removeChannel(ch)}},[id,session,load]);useWebMcp(c,profile);"
          new="const persistChat=(rows:Array<{role:'user'|'assistant';content:string}>)=>{setChat(rows);if(chatKey)localStorage.setItem(chatKey,JSON.stringify(rows))};const viewerRole:('consumer'|'merchant')|null=profile?.role==='consumer'?'consumer':profile?.role==='merchant'?'merchant':null;const load=useCallback(async()=>{if(!session||!viewerRole)return;setErr('');try{if(viewerRole==='consumer'){const {data:own,error}=await supabase.from('cases').select('id,consumer_id').eq('id',id).maybeSingle();if(error||!own||own.consumer_id!==session.user.id)throw new Error('FORBIDDEN')}else{const {data:members,error}=await supabase.from('case_members').select('case_id').eq('case_id',id).eq('profile_id',session.user.id).eq('role','merchant').is('revoked_at',null).limit(1);if(error||!members?.length)throw new Error('FORBIDDEN')}setC(await loadCase(id))}catch{setC(null);setErr(t.notFound)}},[id,t.notFound,session?.user.id,viewerRole]);useEffect(()=>{if(!session){sessionStorage.setItem('rr-next','/claim/'+id);go('/auth');return}if(!profile)return;load();const ch=supabase.channel('case-'+id+'-'+session.user.id).on('postgres_changes',{event:'*',schema:'public',table:'cases',filter:`id=eq.${id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'case_events',filter:`case_id=eq.${id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'resolution_offers',filter:`case_id=eq.${id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'contact_attempts',filter:`case_id=eq.${id}`},load).subscribe();return()=>{supabase.removeChannel(ch)}},[id,session?.user.id,profile?.id,load]);useWebMcp(c&&viewerRole?c:null,profile&&viewerRole?profile:null);"
          assert old in s, 'case load block not found'
          s=s.replace(old,new,1)

          old="const txn=c.transactions?.[0];const consumer=c.consumer_id===session?.user.id;const effectiveStatus="
          new="const txn=c.transactions?.[0];const consumer=viewerRole==='consumer'&&c.consumer_id===session?.user.id;const merchant=viewerRole==='merchant';if(!consumer&&!merchant)return <SimpleTop lang={lang} toggle={toggle}><div className='card'><p>{t.notFound}</p></div></SimpleTop>;const effectiveStatus="
          assert old in s, 'viewer flags not found'
          s=s.replace(old,new,1)

          old="const assist=async(task:string)=>{setAiOpen(true);"
          new="const assist=async(task:string)=>{if(!consumer)return;setAiOpen(true);"
          assert old in s, 'assist function not found'
          s=s.replace(old,new,1)

          old="const sendChat=async()=>{const q=chatInput.trim();"
          new="const sendChat=async()=>{if(!consumer)return;const q=chatInput.trim();"
          assert old in s, 'sendChat function not found'
          s=s.replace(old,new,1)

          old="<div className='card aiBox aiCompact'>"
          new="{consumer&&<div className='card aiBox aiCompact'>"
          assert old in s, 'AI box not found'
          s=s.replace(old,new,1)

          old="</div></section><aside><div className='card timeline'>"
          new="</div>}</section><aside><div className='card timeline'>"
          assert old in s, 'AI box closing boundary not found'
          s=s.replace(old,new,1)

          old="{!consumer&&<MerchantActions lang={lang} c={c} action={action}/>}"
          new="{merchant&&<MerchantActions lang={lang} c={c} action={action}/>}"
          assert old in s, 'merchant actions gate not found'
          s=s.replace(old,new,1)

          old="{aiOpen&&<div className='aiDrawerBackdrop'"
          new="{consumer&&aiOpen&&<div className='aiDrawerBackdrop'"
          assert old in s, 'AI drawer gate not found'
          s=s.replace(old,new,1)

          p.write_text(s)
      - name: Verify build
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit role isolation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce strict consumer merchant isolation'
          git push origin main
