name: Production E2E QA

on:
  workflow_dispatch:

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production health
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 5 --retry-delay 4 https://resolverelai.netlify.app/api/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
      - name: Run real consumer-to-merchant production flow
        run: node scripts/production-e2e.mjs
